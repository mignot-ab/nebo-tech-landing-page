<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="erpGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="erpAmberGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="erpDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E24" />
      <stop offset="100%" stop-color="#0B0B0E" />
    </linearGradient>
    <filter id="erpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(20, 20)" filter="url(#erpShadow)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#erpDark)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5" />
    
    <!-- Interconnected Isometric Nexus (Enterprise ERP Cubes) -->
    <!-- Top Face -->
    <path d="M40 18 L60 29 L40 40 L20 29 Z" fill="#FDE68A" />
    <!-- Left Face -->
    <path d="M20 29 L40 40 V62 L20 51 Z" fill="url(#erpGold)" />
    <!-- Right Face -->
    <path d="M40 40 L60 29 V51 L40 62 Z" fill="#92400E" />
    <!-- Center Dynamic Core -->
    <circle cx="40" cy="40" r="4.5" fill="#FFFFFF" />
    <!-- Synchronized Orbit Ring -->
    <path d="M16 40 C16 52 27 64 40 64 C53 64 64 52 64 40" stroke="url(#erpAmberGlow)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 4"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(122, 26)">
    <g transform="translate(0, 0)">
      <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.03em" fill="#FFFFFF">
        NEBO
      </text>
      <!-- Premium ERP Tag -->
      <rect x="110" y="10" width="76" height="30" rx="8" fill="rgba(245, 158, 11, 0.14)" stroke="url(#erpGold)" stroke-width="1.2" />
      <text x="148" y="31" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="16" font-weight="800" letter-spacing="0.08em" fill="#FBBF24" text-anchor="middle">
        ERP
      </text>
    </g>
    <text x="1" y="62" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', monospace" font-size="11" font-weight="600" letter-spacing="0.22em" fill="#A1A1AA">
      ENTERPRISE RESOURCE PLANNING
    </text>
  </g>
</svg>
