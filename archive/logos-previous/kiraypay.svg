<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="kirayTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>
    <linearGradient id="kirayGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="kirayDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2320" />
      <stop offset="100%" stop-color="#071210" />
    </linearGradient>
    <filter id="kirayGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0D9488" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(20, 20)" filter="url(#kirayGlow)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#kirayDark)" stroke="rgba(94, 234, 212, 0.3)" stroke-width="1.5" />
    
    <!-- Modern Isometric Architectural Building & Digital Coin / Key -->
    <path d="M25 42 L40 28 L55 42 V64 H25 Z" fill="none" stroke="url(#kirayTeal)" stroke-width="3.5" stroke-linejoin="round" />
    <!-- Dynamic Payment Card / Vault slot -->
    <rect x="33" y="46" width="14" height="18" rx="2" fill="url(#kirayGold)" />
    <!-- Chimney / High-rise peak -->
    <path d="M48 35 V26 H53 V40" stroke="url(#kirayTeal)" stroke-width="2.5" />
    <circle cx="58" cy="22" r="3" fill="#5EEAD4" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(122, 26)">
    <g transform="translate(0, 0)">
      <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.03em" fill="#FFFFFF">
        Kiray<tspan fill="url(#kirayGold)">Pay</tspan>
      </text>
      <!-- Property Platform Tag -->
      <rect x="156" y="10" width="112" height="30" rx="8" fill="rgba(13, 148, 136, 0.16)" stroke="url(#kirayTeal)" stroke-width="1.2" />
      <text x="212" y="31" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="14" font-weight="800" letter-spacing="0.08em" fill="#5EEAD4" text-anchor="middle">
        PROPERTY
      </text>
    </g>
    <text x="1" y="62" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', monospace" font-size="11" font-weight="600" letter-spacing="0.18em" fill="#A1A1AA">
      PROPERTY MANAGEMENT &amp; RENT RAILS
    </text>
  </g>
</svg>
