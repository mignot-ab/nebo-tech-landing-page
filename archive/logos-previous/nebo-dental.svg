<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="dentalCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>
    <linearGradient id="dentalAqua" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <linearGradient id="dentalDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1D24" />
      <stop offset="100%" stop-color="#070D10" />
    </linearGradient>
    <filter id="dentalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#06B6D4" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(20, 20)" filter="url(#dentalGlow)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#dentalDark)" stroke="rgba(103, 232, 249, 0.3)" stroke-width="1.5" />
    
    <!-- Stylized Precision Dental Tooth Contour -->
    <path d="M40 20 C28 20 23 26 23 35 C23 48 29 55 33 66 C34 70 36 71 38 71 C40 71 41 68 42 63 C43 60 44 60 45 63 C46 68 47 71 49 71 C51 71 53 70 54 66 C58 55 64 48 64 35 C64 26 59 20 47 20 C44 20 42 22 40 23 C38 22 36 20 40 20 Z" 
          fill="none" stroke="url(#dentalCyan)" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Medical Sparkle / Whitening Radiance -->
    <path d="M40 32 V46 M33 39 H47" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="56" cy="24" r="3" fill="#A5F3FC" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(122, 26)">
    <g transform="translate(0, 0)">
      <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.03em" fill="#FFFFFF">
        NEBO
      </text>
      <!-- DENTAL Pill Tag -->
      <rect x="110" y="10" width="102" height="30" rx="8" fill="rgba(6, 182, 212, 0.16)" stroke="url(#dentalCyan)" stroke-width="1.2" />
      <text x="161" y="31" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="15" font-weight="800" letter-spacing="0.1em" fill="#A5F3FC" text-anchor="middle">
        DENTAL
      </text>
    </g>
    <text x="1" y="62" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', monospace" font-size="11" font-weight="600" letter-spacing="0.2em" fill="#A1A1AA">
      CLINICAL PRACTICE &amp; CHARTING ERP
    </text>
  </g>
</svg>
