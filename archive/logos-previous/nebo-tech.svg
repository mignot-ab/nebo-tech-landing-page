<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="neboBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#0075FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#0075FF" />
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0.2" />
    </linearGradient>
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Arched Horizon Line -->
  <path d="M 180 185 C 320 80, 470 68, 496 68" stroke="url(#neboBlueGrad)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 528 68 C 554 68, 704 80, 844 185" stroke="url(#neboBlueGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Radiant 4-Point Apex Star -->
  <g transform="translate(512, 68)" filter="url(#starGlow)">
    <path d="M 0 -42 C 0 -10, 10 0, 42 0 C 10 0, 0 10, 0 42 C 0 10, -10 0, -42 0 C -10 0, 0 -10, 0 -42 Z" fill="#0075FF" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
  </g>

  <!-- Typography NEBO -->
  <!-- N -->
  <path d="M 40 310 V 205 L 145 285 V 205 H 170 V 310 H 145 L 65 228 V 310 Z" fill="#FFFFFF" />

  <!-- E (Three Rounded Horizontal Bars) -->
  <g transform="translate(250, 0)">
    <!-- Top Bar -->
    <rect x="0" y="205" width="165" height="26" rx="10" fill="#FFFFFF" />
    <!-- Middle Bar (Electric Blue) -->
    <rect x="0" y="247" width="165" height="26" rx="10" fill="#0075FF" filter="url(#starGlow)" />
    <!-- Bottom Bar -->
    <rect x="0" y="289" width="165" height="26" rx="10" fill="#FFFFFF" />
  </g>

  <!-- B (Rounded Geometric B) -->
  <g transform="translate(480, 0)">
    <path d="M 0 205 H 125 C 160 205, 175 220, 175 245 C 175 258, 168 268, 150 272 C 172 276, 180 288, 180 302 C 180 328, 160 340, 125 340 H 0 Z 
             M 25 228 V 260 H 115 C 135 260, 148 255, 148 244 C 148 233, 135 228, 115 228 Z 
             M 25 282 V 317 H 120 C 140 317, 153 312, 153 299 C 153 286, 140 282, 120 282 Z" 
          fill="#FFFFFF" />
  </g>

  <!-- O (Geometric Rounded Rect / Squircle) -->
  <g transform="translate(730, 0)">
    <rect x="0" y="205" width="180" height="135" rx="38" fill="none" stroke="#FFFFFF" stroke-width="26" />
  </g>

  <!-- Subtitle: TECH SOLUTION PLC. -->
  <text x="512" y="398" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="34" font-weight="700" letter-spacing="0.32em" fill="#FFFFFF">
    TECH SOLUTION PLC.
  </text>
</svg>
