<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="hospBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="hospPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
    <linearGradient id="hospDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1A28" />
      <stop offset="100%" stop-color="#060F17" />
    </linearGradient>
    <filter id="hospGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(20, 20)" filter="url(#hospGlow)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#hospDark)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
    
    <!-- Protective Hospital Shield Contour -->
    <path d="M40 18 C56 18 64 24 64 36 C64 54 48 68 40 72 C32 68 16 54 16 36 C16 24 24 18 40 18 Z" 
          fill="none" stroke="url(#hospBlue)" stroke-width="3" stroke-linejoin="round"/>
    <!-- Medical Cross -->
    <path d="M36 28 H44 V36 H52 V44 H44 V52 H36 V44 H28 V36 H36 Z" fill="rgba(56, 189, 248, 0.2)" />
    <!-- Dynamic Lifeline Pulse Wave -->
    <path d="M22 40 H31 L35 32 L40 50 L45 35 L49 43 L52 40 H58" stroke="url(#hospPulse)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="58" cy="22" r="3" fill="#38BDF8" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(122, 26)">
    <g transform="translate(0, 0)">
      <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.03em" fill="#FFFFFF">
        NEBO
      </text>
      <!-- HOSPITAL & CLINIC Pill Tag -->
      <rect x="110" y="10" width="180" height="30" rx="8" fill="rgba(2, 132, 199, 0.16)" stroke="url(#hospBlue)" stroke-width="1.2" />
      <text x="200" y="31" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="13" font-weight="800" letter-spacing="0.08em" fill="#38BDF8" text-anchor="middle">
        HOSPITAL &amp; CLINIC
      </text>
    </g>
    <text x="1" y="62" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', monospace" font-size="11" font-weight="600" letter-spacing="0.18em" fill="#A1A1AA">
      HEALTHCARE &amp; CLINICAL INFORMATION SYSTEM
    </text>
  </g>
</svg>
