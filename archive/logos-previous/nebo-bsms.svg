<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bsmsViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="bsmsPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
    <linearGradient id="bsmsDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1429" />
      <stop offset="100%" stop-color="#0E0B16" />
    </linearGradient>
    <filter id="bsmsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#9333EA" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(20, 20)" filter="url(#bsmsGlow)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#bsmsDark)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1.5" />
    
    <!-- Elegant Intersecting Curves (B / Infinity / Salon Shear & Business Balance) -->
    <path d="M28 22 H44 C53 22 58 27 58 34 C58 40 54 44 47 45 C55 46 60 51 60 58 C60 66 53 71 43 71 H28 Z" fill="none" stroke="url(#bsmsViolet)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Dynamic Accent Sweep -->
    <path d="M34 35 H44 C48 35 50 37 50 40 C50 43 48 45 44 45 H34 Z" fill="url(#bsmsPink)" opacity="0.85" />
    <path d="M34 49 H45 C50 49 52 51 52 55 C52 59 50 61 45 61 H34 Z" fill="url(#bsmsViolet)" />
    <!-- Radiant Sparkle / Appointment Gem -->
    <circle cx="56" cy="24" r="3.5" fill="#F472B6" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(122, 26)">
    <g transform="translate(0, 0)">
      <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.03em" fill="#FFFFFF">
        NEBO
      </text>
      <!-- BSMS Pill Tag -->
      <rect x="110" y="10" width="88" height="30" rx="8" fill="rgba(147, 51, 234, 0.16)" stroke="url(#bsmsViolet)" stroke-width="1.2" />
      <text x="154" y="31" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="15" font-weight="800" letter-spacing="0.1em" fill="#E9D5FF" text-anchor="middle">
        BSMS
      </text>
    </g>
    <text x="1" y="62" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', monospace" font-size="11" font-weight="600" letter-spacing="0.18em" fill="#A1A1AA">
      BUSINESS &amp; SALON MANAGEMENT SYSTEM
    </text>
  </g>
</svg>
